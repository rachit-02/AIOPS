# =============================================================================
# LOCAL-DEV CREDENTIALS, COMMITTED DELIBERATELY.
#
# These are the SAME throwaway values already present in docker-compose.yml and
# db/init/01-schemas.sql. They protect a disposable cluster that listens only on
# localhost. Committing them keeps Git the single source of truth: every object
# in the cluster comes from this repository, with no out-of-band `kubectl create
# secret` step that would leave the cluster un-reproducible.
#
# THIS IS NOT WHAT PRODUCTION LOOKS LIKE. Real options, in rough order of
# preference:
#   - External Secrets Operator pulling from a real secret manager
#   - Sealed Secrets (encrypted in Git, decryptable only by the cluster)
#   - SOPS + age with ArgoCD's kustomize plugin
# Each adds a component and moving parts that buy nothing for credentials that
# are already public in this repo. Worth stating plainly in a viva: the choice
# is deliberate and scoped, not an oversight.
#
# `stringData` rather than `data` so the values stay human-readable and
# reviewable in a diff; Kubernetes base64-encodes them on write.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: aiops-postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres_dev_pw
---
# Shared by gateway (verifies JWTs) and auth (signs them). Both fail fast on
# startup if it is missing, which is how the Phase 2 manifests were caught
# omitting it from the gateway.
apiVersion: v1
kind: Secret
metadata:
  name: aiops-jwt
type: Opaque
stringData:
  JWT_SECRET: local-dev-secret-change-me
---
# One DATABASE_URL per service, each with its OWN Postgres role. The role grants
# in db/init/01-schemas.sql are what actually enforce the boundary - notably
# aiops_orders holds SELECT only, so the CQRS read/write split is enforced by
# the database rather than by convention.
apiVersion: v1
kind: Secret
metadata:
  name: aiops-auth-db
type: Opaque
stringData:
  DATABASE_URL: postgres://aiops_auth:auth_dev_pw@postgres:5432/aiops
---
apiVersion: v1
kind: Secret
metadata:
  name: aiops-user-db
type: Opaque
stringData:
  DATABASE_URL: postgres://aiops_user:user_dev_pw@postgres:5432/aiops
---
apiVersion: v1
kind: Secret
metadata:
  name: aiops-product-db
type: Opaque
stringData:
  DATABASE_URL: postgres://aiops_product:product_dev_pw@postgres:5432/aiops
---
apiVersion: v1
kind: Secret
metadata:
  name: aiops-order-db
type: Opaque
stringData:
  DATABASE_URL: postgres://aiops_order:order_dev_pw@postgres:5432/aiops
---
apiVersion: v1
kind: Secret
metadata:
  name: aiops-orders-db
type: Opaque
stringData:
  # SELECT-only role: the read path physically cannot write.
  DATABASE_URL: postgres://aiops_orders:orders_dev_pw@postgres:5432/aiops
