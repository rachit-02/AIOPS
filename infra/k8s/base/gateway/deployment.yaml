apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: aiops
spec:
  replicas: 2                      # 2 = a rolling update never drops to zero capacity
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: aiops
    spec:
      containers:
        - name: gateway
          # Image name is a PLACEHOLDER. The overlay's `images:` block rewrites
          # both the registry (to ECR) and the tag (to the commit SHA that CI
          # built). Never edit this line by hand - CI owns it.
          image: aiops/gateway
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: aiops-service-urls
          # Liveness: process-only check. If this touched the database, one
          # slow query would restart every pod and turn a blip into an outage.
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: includes dependencies. A failing DB pulls the pod out of
          # the Service's endpoints without killing it, so it can recover.
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          # Sized for t3.small nodes (2 vCPU / ~1.7Gi allocatable). Requests
          # drive scheduling; limits stop one service starving the others.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
