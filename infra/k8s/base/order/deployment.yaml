apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/part-of: aiops
spec:
  # 1 replica, not 2: the whole platform shares a laptop. Rolling updates are
  # still observable because maxUnavailable defaults to 25% -> rounds to a
  # surge pod, so a new pod starts before the old one is removed.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order
        app.kubernetes.io/part-of: aiops
    spec:
      containers:
        - name: order
          # PLACEHOLDER rewritten by the overlay's `images:` block, which CI
          # owns. Never edit by hand.
          image: aiops/order
          ports:
            - name: http
              containerPort: 3000
          env:
            # SEEDED BUG toggle - see services/order/src/index.js.
            # Flipping this to "true" and pushing IS the incident: ArgoCD rolls
            # it out, so even breaking production happens through Git.
            - name: SEED_BUG_NULL_SHIPPING
              value: "false"
          envFrom:
            - configMapRef:
                name: aiops-service-urls
            - secretRef:
                name: aiops-order-db
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            # MUST be numeric. The Dockerfile says `USER node`, and Kubernetes
            # refuses to start a container when runAsNonRoot is set but the
            # image's user is a NAME it cannot resolve to a uid:
            #   "container has runAsNonRoot and image has non-numeric user
            #    (node), cannot verify user is non-root"
            # 1000 is the uid of `node` in node:22-alpine (verified with
            # `id -u node`). Setting it here keeps the guarantee Kubernetes
            # could not otherwise verify.
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
