apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/part-of: aiops
spec:
  # 1 replica, not 2: the whole platform shares a laptop. Rolling updates are
  # still observable because maxUnavailable defaults to 25% -> rounds to a
  # surge pod, so a new pod starts before the old one is removed.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order
        app.kubernetes.io/part-of: aiops
    spec:
      containers:
        - name: order
          # PLACEHOLDER rewritten by the overlay's `images:` block, which CI
          # owns. Never edit by hand.
          image: aiops/order
          ports:
            - name: http
              containerPort: 3000
          env:
            # SEEDED BUG toggle - see services/order/src/index.js.
            # Flipping this to "true" and pushing IS the incident: ArgoCD rolls
            # it out, so even breaking production happens through Git.
            - name: SEED_BUG_NULL_SHIPPING
              value: "false"
          envFrom:
            - configMapRef:
                name: aiops-service-urls
            - secretRef:
                name: aiops-order-db
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
