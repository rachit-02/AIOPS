apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: aiops
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    # Port 3000 cluster-wide, matching docker-compose, so SERVICE_URL env vars
    # are identical locally and on EKS.
    - name: http
      port: 3000
      targetPort: http
